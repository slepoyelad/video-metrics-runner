<!doctype html>
<html lang="he" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100e21"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com; media-src blob:; frame-src https://suno.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Language Raps · חדר העריכה</title><link rel="stylesheet" href="screen.css"><link rel="manifest" href="../app.webmanifest"><script type="module" src="studio.mjs"></script>
</head><body><header class="top"><div class="bar"><strong>Language Raps</strong><a href="/what-if-site/control/" dir="ltr">What If ↗</a></div></header>
<main><div class="heading"><div><h1>חדר העריכה</h1><small id="updated"></small></div></div>
<section id="login" class="panel" hidden><h2>כניסה לחדר העריכה הפרטי</h2><p>החיבור מאפשר לפתוח את ההקלטות והסקיצות מהטלפון.</p>
<form><label id="repoLabel">מאגר הנתונים<input id="repo" required pattern="[A-Za-z0-9_.-]+" dir="ltr"></label><label>מפתח GitHub של הדאשבורד<input id="token" type="password" dir="ltr" required autocomplete="off"></label>
<label><input id="remember" type="checkbox"> לזכור אותי במכשיר הזה</label><button>כניסה</button></form></section>
<p id="status" role="status" aria-live="polite"></p>
<div id="desk" hidden><div id="shelves"></div><div class="section-heading"><h2>ביצועי הסרטונים</h2><button id="refresh">רענון נתונים</button></div><div id="metrics"></div><button id="disconnect" class="quiet">ניתוק המכשיר</button></div>
<dialog id="confirmDialog"><form id="decision"><h2 id="question"></h2><p id="detail" dir="auto"></p><label id="feedback" hidden>מה לתקן בסקיצה?<textarea id="note" maxlength="800" rows="3"></textarea></label><div class="links"><button id="confirm">אישור</button><button type="button" id="cancel">ביטול</button></div></form></dialog>
</main></body></html>
