<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#132123"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'"><title>ביצועי הסרטונים</title><link rel="manifest" href="./app.webmanifest"><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./screen.css"><script src="./app.js" defer></script></head>
<body><main><header><div><h1>ביצועי הסרטונים</h1><p id="updated"></p></div><button id="refresh" hidden>רענון נתונים</button></header>
<section id="login"><h2>חיבור לדוח הפרטי</h2><p><a id="native">פתיחה בחשבון GitHub שלך</a></p><p>לרענון בלחיצה מתוך הדף, חבר מפתח GitHub אישי המוגבל לשני מאגרי הדאשבורד, עם Contents בקריאה ו־Actions בכתיבה.</p><form><label>שם מאגר הנתונים הפרטי<input id="repo" required pattern="[A-Za-z0-9_.-]+" dir="ltr"></label><label>מפתח GitHub<input id="token" type="password" autocomplete="off" required dir="ltr"></label><label><input id="remember" type="checkbox"> זכור את החיבור במכשיר הזה</label><button>חיבור</button></form></section>
<p id="status" role="status"></p><div id="report" hidden><section id="cards" aria-label="סיכום לפי פלטפורמה"></section><h2>הסרטונים שלי</h2><section id="videos"></section><button class="quiet" id="disconnect">ניתוק המכשיר</button></div></main></body></html>
